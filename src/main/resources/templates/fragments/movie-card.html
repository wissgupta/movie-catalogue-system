<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="card (movie)">
<div class="card movie-card h-100 shadow-sm border-0 text-white bg-dark position-relative">
    <img th:src="'https://image.tmdb.org/t/p/w500' + ${movie.posterPath}" class="card-img-top" th:alt="${movie.title}" />
    <div class="card-body d-flex flex-column">
        <h5 class="card-title" th:text="${movie.title}">Movie Title</h5>
        <p class="card-text small mb-2" th:text="'⭐ ' + ${movie.rating} + ' / 10'">Rating</p>
        <a th:href="@{/movie/{id}(id=${movie.id})}" class="btn btn-sm btn-danger mt-auto">Details</a>
    </div>
    <div class="tagline-tooltip" th:if="${movie.tagline}" th:title="${movie.tagline}">🛈</div>
</div>
</html>
