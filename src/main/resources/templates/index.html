<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movie Catalogue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body class="dark-theme">
<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">

    <!-- 🔍 Search Bar -->
    <form th:action="@{/search}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" name="query" placeholder="Search for movies..." th:value="${searchQuery}">
            <button class="btn btn-outline-light" type="submit">Search</button>
        </div>
    </form>

    <!-- 📢 Page Context (Search or Genre Info) -->
    <div class="mb-4">
        <h2 class="text-white" th:if="${searchQuery != null}">Search Results for "<span th:text="${searchQuery}"></span>"</h2>
        <h2 class="text-white" th:if="${searchQuery == null}">Explore Movies</h2>
    </div>

    <!-- 🌟 Featured Movie -->
    <div class="featured-movie mb-4" th:if="${movies != null and #lists.size(movies) > 0}">
        <div class="card bg-dark text-white border-0">
            <img th:src="'https://image.tmdb.org/t/p/original' + ${movies[0].backdropPath}" class="card-img" alt="Featured Image">
            <div class="card-img-overlay d-flex flex-column justify-content-end">
                <h1 class="card-title display-4 fw-bold" th:text="${movies[0].title}">Movie Title</h1>
                <p class="card-text lead" th:text="${movies[0].overview}">Movie description goes here...</p>
                <a th:href="@{/movie/{id}(id=${movies[0].id})}" class="btn btn-danger mt-2 w-25">View Details</a>
            </div>
        </div>
    </div>

    <!-- 🎬 Movie Grid -->
    <div class="row" th:if="${movies != null}">
        <div class="col-md-3 mb-4" th:each="movie : ${movies}">
            <div th:replace="~{fragments/movie-card :: card(movie=${movie})}"></div>
        </div>
    </div>

    <!-- No results -->
    <div th:if="${movies != null and #lists.isEmpty(movies)}" class="text-center text-muted mt-5">
        <p>No movies found.</p>
        <a href="/" class="btn btn-outline-light">Back to Home</a>
    </div>

</div>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
